# Compila el proyecto Vite y lo publica en GitHub Pages.
# Se ejecuta automáticamente en cada push a la rama master.
name: Deploy a GitHub Pages

on:
  push:
    branches: [master]
  # Permite lanzarlo manualmente desde la pestaña "Actions" del repo.
  workflow_dispatch:

# Permisos mínimos necesarios para publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues solapados: si llega un push nuevo, cancela el anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # ⚠ La imagen va FIJADA a propósito. GitHub avisa en cada ejecución de que `ubuntu-latest` pasa a
    # Ubuntu 26 a partir del 2026-10-19: con la etiqueta flotante, el entorno de la puerta a producción
    # cambiaría ese día sin que nadie lo hubiera probado. `ubuntu-24.04` es la imagen que servía
    # `ubuntu-latest` hasta ahora. Subir a `ubuntu-26.04` (ya existe) es un cambio deliberado: en su
    # propio commit, y mirando la primera ejecución.
    runs-on: ubuntu-24.04
    steps:
      # Las acciones van en versiones que corren en Node 24 (2026-09-19). Con las anteriores, GitHub
      # avisaba en cada ejecución de que las forzaba a Node 24: da Node 20 por obsoleto en sus runners.
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          # El Node con el que corren las PRUEBAS. Node 24 es LTS hasta el 2028-04-30; aquí ponía 20,
          # sin soporte desde el 2026-04-30. ⚠ happy-dom no se comporta igual en todas las versiones de
          # Node: antes de un push, la suite con ESTE Node (README, «Testing y calidad»).
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # ⚠⚠ ESTOS DOS PASOS SON LA PUERTA A PRODUCCIÓN.
      # Hasta el 2026-08-30 este flujo sólo compilaba: un push a master publicaba
      # aunque la suite estuviera roja, y compilar NO detecta una regresión — Vite
      # empaqueta igual de bien un cálculo equivocado que uno correcto.
      # Van ANTES de compilar y en este mismo job para reaprovechar el `npm ci`.
      # Si cualquiera de los dos falla, el job cae y `deploy` (que declara
      # `needs: build`) no llega a ejecutarse: lo roto no sale a producción.
      # El lint va primero por ser segundos frente al minuto y medio de la suite.
      - name: Lint
        run: npm run lint

      # El tamaño de la suite se pregunta con `npm test`; aquí ya no se escribe.
      # ⚠ Había una cifra exacta y CADUCÓ CINCO VECES en tres días: 1944/149, 2064/159,
      # 2091/160, 2100/161 y 2114/162 — esta última se quedó vieja el mismo día que se
      # fechó, porque los commits de esa tarde añadieron archivos DESPUÉS de escribirla.
      # Ir a por el sexto número era repetir el gesto esperando otro resultado: cualquier
      # dato que sólo se actualiza a mano acaba mintiendo, y un comentario que se sabe
      # falso enseña a no leer los comentarios de al lado — que aquí sí importan.
      # Lo que NO caduca y por eso se queda: la suite tarda minutos, no segundos (cuenta
      # para el presupuesto de CI), y
      # `traslado-captura.test.js` arranca el monolito ENTERO sobre happy-dom y necesita
      # más heap del normal: se lo da `vite.config.js` (test.poolOptions.forks.execArgv),
      # que rige también aquí.
      - name: Pruebas
        run: npm test

      # ⚠⚠ LA TERCERA PUERTA, y nace de un defecto medido, no de la teoría.
      # Estas dos auditorías recorren el viaje ENTERO con el código real de las tres
      # mitades (captura → payload → GAS → hoja → tablero, más el PDF), que es justo lo
      # que la suite no cubre: comprueban que el papel y la pantalla cuenten lo MISMO del
      # mismo viaje, y la adversa mete los casos hostiles.
      # Vivían FUERA del repo y no las corría nadie, así que se rompieron dos veces —M5
      # con `filasUniformes`, y el anexo de fotos con `trasFotosPdfHtml`— y las dos veces
      # se quedaron rotas EN SILENCIO desde un commit que YA estaba en producción.
      # Aquí dejan de depender de que alguien se acuerde. Tardan segundos: no mueven el
      # presupuesto de CI.
      - name: Auditorías de Traslado (extremo a extremo)
        run: npm run auditorias

      - name: Compilar (genera /dist)
        run: npm run build

      # v5: la primera que empaqueta con `upload-artifact` en Node 24 (la v4 aún usaba la de Node 20).
      # ⚠ Desde la v4 deja FUERA los archivos ocultos (los que empiezan por punto). `dist/` no tiene
      # ninguno (medido el 2026-09-19); si algún día hace falta uno: `include-hidden-files: true`.
      - name: Preparar artefacto de Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04   # fijada por lo mismo que la de `build`
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
